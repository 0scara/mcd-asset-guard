<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="mcd-asset-guard 架构图">
  <title>mcd-asset-guard 调用链路</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8FA79A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="520" rx="12" fill="#FFFFFF"/>

  <rect x="350" y="40" width="300" height="48" rx="10" fill="#F2B233"/>
  <text x="500" y="69" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#12332A">我的权益什么时候到期</text>

  <path class="arr" d="M500 88 V114 H185 V140" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="arr" d="M500 88 V140" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="arr" d="M500 88 V114 H815 V140" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="140" width="290" height="80" rx="10" fill="#EAF0EC" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="64" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#12332A">A · 资产盘点</text>
  <text x="64" y="192" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6F64">积分四项 + 券列表 + 未领券</text>
  <text x="64" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6F64">按剩余天数排序</text>

  <rect x="355" y="140" width="290" height="80" rx="10" fill="#EAF0EC" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="379" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#12332A">B · 积分去向决策</text>
  <text x="379" y="192" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6F64">抽奖期望值 vs 商城兑换价值</text>
  <text x="379" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6F64">差距 20% 内优先兑换</text>

  <rect x="670" y="140" width="290" height="80" rx="10" fill="#EAF0EC" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="694" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#12332A">C · 消耗方案</text>
  <text x="694" y="192" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6F64">组合临期券 + 选品</text>
  <text x="694" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6F64">calculate-price 实测抵扣</text>

  <path class="arr" d="M185 220 V256" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="arr" d="M500 220 V256" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="arr" d="M815 220 V256" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>

