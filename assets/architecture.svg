  <rect x="483" y="294" width="139" height="28" rx="6" fill="#FFFFFF" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="552.5" y="312" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#2F4A3D">available-coupons</text>

  <rect x="72" y="336" width="139" height="28" rx="6" fill="#FFFFFF" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="141.5" y="354" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#2F4A3D">query-lottery-info</text>
  <rect x="223" y="336" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="303" y="354" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#2F4A3D">mall-points-products</text>
  <rect x="395" y="336" width="146" height="28" rx="6" fill="#FFFFFF" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="468" y="354" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#2F4A3D">mall-product-detail</text>
  <rect x="553" y="336" width="125" height="28" rx="6" fill="#FFFFFF" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="615.5" y="354" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#2F4A3D">calculate-price</text>
  <rect x="690" y="336" width="153" height="28" rx="6" fill="#FFFFFF" stroke="#C3D3C8" stroke-width="0.5"/>
  <text x="766.5" y="354" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#2F4A3D">query-nearby-stores</text>

  <path class="arr" d="M185 376 V420" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="arr" d="M500 376 V420" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="arr" d="M815 376 V420" fill="none" stroke="#8FA79A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="420" width="290" height="80" rx="10" fill="#12332A"/>
  <text x="64" y="450" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">盘点表</text>
  <text x="64" y="472" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB5AC">四项积分 + 临期券清单</text>
  <text x="64" y="489" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB5AC">紧迫度四级分级</text>

  <rect x="355" y="420" width="290" height="80" rx="10" fill="#12332A"/>
  <text x="379" y="450" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">决策结论</text>
  <text x="379" y="472" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB5AC">一句话结论 + 依据</text>
  <text x="379" y="489" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB5AC">估算值明确标注</text>

  <rect x="670" y="420" width="290" height="80" rx="10" fill="#12332A"/>
  <text x="694" y="450" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">本周行动</text>
  <text x="694" y="472" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB5AC">先花哪张券</text>
  <text x="694" y="489" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB5AC">配到具体一餐</text>
</svg>
